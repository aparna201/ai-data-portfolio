name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --prefix projects/04-hospital-receivables-agent/n8n
      - run: pip install -r requirements.txt -r projects/02-publishing-analytics-spark/requirements.txt
      - run: pytest -q
